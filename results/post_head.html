<title>Reading the Activation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --ground:#FAFAF9; --surface:#FFFFFF; --surface-2:#F0F1F2;
  --ink:#16181C; --ink-soft:#535861; --ink-faint:#8A8F98;
  --rule:#E2E4E7;
  --signal:#1F6F5C; --signal-wash:#E4F0EC;
  --flat:#9AA0A8;
  --amber:#9A6420; --amber-wash:#F7EEE2;
  --shadow:0 1px 2px rgba(20,22,26,.05), 0 10px 28px -14px rgba(20,22,26,.20);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1013; --surface:#16191E; --surface-2:#1D2127;
    --ink:#E9EBEE; --ink-soft:#9BA2AB; --ink-faint:#71787F;
    --rule:#262B31;
    --signal:#5CC3A6; --signal-wash:#122A24;
    --flat:#6B7178;
    --amber:#D2A063; --amber-wash:#2A2117;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1013; --surface:#16191E; --surface-2:#1D2127;
  --ink:#E9EBEE; --ink-soft:#9BA2AB; --ink-faint:#71787F;
  --rule:#262B31;
  --signal:#5CC3A6; --signal-wash:#122A24;
  --flat:#6B7178;
  --amber:#D2A063; --amber-wash:#2A2117;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px; margin:0 auto; padding:0 28px 100px}

header{padding:64px 0 30px}
.kicker{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-faint); margin:0 0 8px;
}
h1{
  font-family:Newsreader,Georgia,serif; font-weight:500;
  font-size:clamp(34px,5.6vw,50px); line-height:1.08; letter-spacing:-.018em;
  margin:0 0 12px; text-wrap:balance;
}
.subtitle{
  font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-faint);
  margin:0 0 26px;
}
nav.toc{
  border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
  padding:14px 0; margin-bottom:36px;
  display:flex; flex-wrap:wrap; gap:6px 20px;
}
nav.toc a{
  font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft);
  text-decoration:none; border-bottom:1px solid transparent;
}
nav.toc a:hover{color:var(--signal); border-bottom-color:var(--signal)}

h2{
  font-family:Newsreader,Georgia,serif; font-weight:500;
  font-size:clamp(25px,3.4vw,32px); line-height:1.2; letter-spacing:-.014em;
  margin:56px 0 14px; scroll-margin-top:22px; text-wrap:balance;
}
h3{
  font-family:Newsreader,Georgia,serif; font-weight:500; font-size:21px;
  line-height:1.28; margin:38px 0 10px; scroll-margin-top:22px;
}
h4{
  font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  color:var(--signal); margin:26px 0 8px;
}
p{margin:0 0 18px}
ul,ol{padding-left:22px} li{margin-bottom:11px}
a{color:var(--signal)}
strong{font-weight:600}
em{font-style:italic}
code,.mono{font-family:"IBM Plex Mono",monospace; font-size:.88em}
code{background:var(--surface-2); padding:.12em .36em; border-radius:3px}
.note{color:var(--ink-soft); font-size:15.5px}

.finding{
  background:var(--signal-wash); border-left:3px solid var(--signal);
  border-radius:0 4px 4px 0; padding:14px 18px; margin:18px 0 22px;
}
.finding p{margin:0; font-size:16px}
.finding b{color:var(--ink)}

.aside{
  border:1px solid var(--rule); border-left:3px solid var(--amber);
  background:var(--surface); border-radius:0 4px 4px 0;
  padding:15px 18px; margin:22px 0; box-shadow:var(--shadow);
}
.aside .lbl{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--amber); margin-bottom:6px;
}
.aside p{margin:0; font-size:15.5px; color:var(--ink-soft)}
.aside p + p{margin-top:9px}

figure{margin:30px 0 26px; padding:0}
.figbox{
  background:var(--surface); border:1px solid var(--rule); border-radius:5px;
  box-shadow:var(--shadow); padding:18px 16px 10px; overflow-x:auto;
}
.figbox svg{display:block; min-width:540px; width:100%; height:auto}
figcaption{font-size:14px; color:var(--ink-soft); margin-top:12px; line-height:1.55}
figcaption b{color:var(--ink); font-weight:600}
.legend{
  display:flex; flex-wrap:wrap; gap:5px 20px; margin:12px 2px 0;
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-soft);
}
.legend span{display:inline-flex; align-items:center; gap:7px}
.sw{width:16px; height:0; border-top-width:2.5px; border-top-style:solid; flex:none}

.tablewrap{overflow-x:auto; margin:22px 0}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:420px}
caption{
  text-align:left; font-family:"IBM Plex Mono",monospace; font-size:11px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);
  padding-bottom:10px;
}
th,td{padding:9px 14px 9px 0; text-align:left; border-bottom:1px solid var(--rule); vertical-align:top}
th{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;
  letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint);
}
td.num,th.num{text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
tr.hi td{background:var(--signal-wash)} tr.hi td:first-child{font-weight:600}
td.dim{color:var(--ink-faint)}
.sig{color:var(--signal); font-weight:600}

pre{
  background:var(--surface); border:1px solid var(--rule); border-radius:4px;
  padding:14px 16px; overflow-x:auto; font-family:"IBM Plex Mono",monospace;
  font-size:12.5px; line-height:1.6; margin:18px 0;
}
pre code{background:none; padding:0}

.quotebox{
  border:1px solid var(--rule); border-radius:5px; background:var(--surface);
  box-shadow:var(--shadow); overflow:hidden; margin:22px 0;
}
.qrow{display:flex; border-bottom:1px solid var(--rule)}
.qrow:last-child{border-bottom:0}
.qrow .k{
  font-family:"IBM Plex Mono",monospace; font-size:12px; padding:11px 14px;
  width:92px; flex:none; color:var(--ink-faint); background:var(--surface-2);
  border-right:1px solid var(--rule); font-variant-numeric:tabular-nums;
}
.qrow .v{padding:11px 16px; font-size:15px}
.qrow.mark{background:var(--signal-wash)}
.qrow.mark .k{color:var(--signal); font-weight:500}

footer{
  margin-top:64px; padding-top:24px; border-top:1px solid var(--rule);
  font-size:14px; color:var(--ink-faint); line-height:1.8;
}
footer a{color:var(--ink-soft)}
</style>
